services:
  - type: web
    name: sg-career-intelligence
    runtime: python
    region: singapore
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    disk:
      name: career-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: DATABASE_PATH
        value: /var/data/career.sqlite3
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: APIFY_TOKENS_JSON
        sync: false
