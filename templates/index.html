<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Find roles · SG Career Intelligence</title>
  <link rel="stylesheet" href="/static/workspace.css">
  <script src="/static/workspace.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace-heading">Skip to workspace</a>
  <header class="site-header" id="site-header">
    <a class="wordmark" href="/">SG Career Intelligence</a>
    <nav aria-label="Workspace">
      <a href="/?view=find" id="nav-find" aria-current="page">Find roles</a>
      <a href="/?view=applications" id="nav-applications">Applications</a>
    </nav>
  </header>
  <div class="workspace" id="workspace">
    <main id="main-content">
      <div class="page-heading">
        <h1 id="workspace-heading" tabindex="-1">Find roles</h1>
        <p id="workspace-intro">Singapore opportunities for Dechsurang.</p>
      </div>
      <div id="global-notices" aria-live="polite"></div>
      <section id="find-view" aria-label="Find roles">
        <form id="search-form" role="search">
          <label class="search-label" for="search-query">Search roles and companies</label>
          <div class="search-line">
            <input id="search-query" name="q" type="search" placeholder="Role, company or keyword" autocomplete="off">
            <button class="primary" type="submit">Search</button>
          </div>
          <div class="filter-bar">
            <details id="filter-details">
              <summary>Filters <span id="filter-count"></span></summary>
              <div class="filter-fields">
                <label>Job family<select name="category" id="category-filter"><option value="">All job families</option></select></label>
                <label>Fit<select name="fit" id="fit-filter"><option value="">All assessments</option><option>Relevant</option><option>Adjacent</option><option>Check requirements</option><option>Not suitable</option></select></label>
                <label>Thai relevance<select name="thai_relevance" id="thai-filter"><option value="">Any relevance</option><option value="required">Thai required</option><option value="preferred">Thai preferred</option><option value="context">Thailand market context</option></select></label>
                <label>Employment type<select name="employment_type" id="employment-filter"><option value="">Any employment type</option></select></label>
                <label>Opportunity type<select name="opportunity_type" id="opportunity-filter"><option value="salaried">Salaried opportunities</option><option value="freelance">Freelance assignments</option><option value="all">All opportunities</option></select></label>
                <label>Minimum monthly salary (S$)<input name="min_salary" id="salary-filter" type="number" min="0" step="100" placeholder="No minimum"></label>
                <label class="checkbox-label"><input name="salary_only" id="salary-only-filter" type="checkbox"> Advertised salary only</label>
                <p class="field-help">Monthly filters use the advertised minimum. Daily and hourly rates keep their original units.</p>
                <button id="clear-filters" class="text-button" type="button">Clear filters</button>
              </div>
            </details>
            <label class="sort-label">Order by<select name="sort_by" id="sort-filter"><option value="recommended">Recommended</option><option value="freshness">Recently verified</option><option value="salary">Advertised salary</option></select></label>
          </div>
        </form>
        <div class="list-toolbar">
          <p id="results-status" role="status" aria-live="polite">Loading roles…</p>
          <button id="export-search" class="text-button" type="button">Export results</button>
        </div>
        <div id="job-list" class="role-list" aria-busy="true"></div>
        <button id="load-more" class="load-more" type="button" hidden>Load more roles</button>
      </section>
      <section id="applications-view" aria-label="Applications" hidden>
        <div class="applications-toolbar">
          <label>Stage<select id="stage-filter"><option value="">All stages</option><option>Saved</option><option>Preparing</option><option>Applied</option><option>Interviewing</option><option>Offer</option><option>Closed</option></select></label>
          <button id="export-applications" class="text-button" type="button" disabled>Export shown applications</button>
        </div>
        <div class="list-toolbar"><p id="applications-status" role="status" aria-live="polite">Loading applications…</p><button type="button" class="text-button" id="refresh-applications">Refresh</button></div>
        <div id="application-list" class="role-list" aria-busy="true"></div>
      </section>
      <noscript><p class="notice">JavaScript is needed to search and save applications in this workspace.</p></noscript>
    </main>
    <aside id="role-detail" class="role-detail" aria-labelledby="detail-title" hidden></aside>
  </div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
